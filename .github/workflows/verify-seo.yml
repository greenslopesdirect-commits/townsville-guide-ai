name: Verify SEO Prerender

on:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, build, prerender, verify-seo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm run build` also runs the prerender and then deletes dist-ssr/, so the standalone
      # prerender step below would have nothing to render. Run the same build stages here
      # without the final prerender, so each stage is its own step.
      - name: Build (sitemap, client bundle, SSR bundle)
        run: npm run prebuild && npx vite build && npx vite build --ssr src/entry-server.tsx --outDir dist-ssr

      - name: Static prerender
        run: node scripts/prerender.mjs

      - name: Verify SEO output
        run: node scripts/verify-seo.mjs
